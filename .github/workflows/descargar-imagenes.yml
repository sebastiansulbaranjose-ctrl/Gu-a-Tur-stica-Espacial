name: Descargar imágenes al proyecto

# Se lanza a mano desde la pestaña Actions de GitHub.
# Los servidores de GitHub descargan las 138 imágenes de Wikimedia y Unsplash,
# reescriben los HTML para que apunten a ./img y suben el resultado a la rama.
# Así no hace falta instalar nada en la computadora de nadie.

on:
  workflow_dispatch:
    inputs:
      confirmar:
        description: 'Escribe SI para confirmar que quieres descargar y subir las imágenes'
        required: true
        default: 'SI'
      buscar:
        description: 'Buscar un nombre de archivo en Commons y solo mostrar el resultado, sin descargar ni subir nada (ej: Laniakea supercluster)'
        required: false
        default: ''
      rehacer:
        description: 'Volver a descargar imágenes ya guardadas, por nombre o patrón (ej: photo-*.jpg). Vacío = no rehace ninguna'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  descargar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Modo consulta: solo pregunta a Commons cómo se llama de verdad un
      # archivo y termina. No descarga ni sube nada, así que los pasos
      # siguientes se saltan.
      - name: Buscar un nombre en Commons
        if: inputs.buscar != ''
        env:
          BUSCAR: ${{ inputs.buscar }}
        run: python herramientas/localizar-imagenes.py --buscar "$BUSCAR"

      - name: Mostrar el inventario
        if: inputs.buscar == ''
        run: python herramientas/localizar-imagenes.py --listar | tail -3

      # Vuelve a pedir imágenes que ya están guardadas, por ejemplo si se
      # bajaron al tamaño equivocado. No basta con borrarlas: el HTML ya dice
      # «img/...», así que las URLs de origen solo siguen existiendo en
      # inventario-imagenes.txt, y de ahí las saca el modo --rehacer. El
      # archivo antiguo se conserva si la nueva descarga falla.
      - name: Volver a descargar las imágenes indicadas
        if: inputs.rehacer != '' && inputs.buscar == ''
        # El valor va por una variable de entorno y no interpolado en el
        # script: así lo que se escriba en el formulario no puede convertirse
        # en órdenes del intérprete.
        env:
          REHACER: ${{ inputs.rehacer }}
        run: |
          # set -f apaga la expansión de comodines del intérprete: los patrones
          # deben llegar tal cual al script, que es quien los compara con los
          # nombres del inventario. Sin esto, «photo-*.jpg» se expandiría contra
          # la raíz del repositorio, donde no hay ninguna imagen.
          set -f
          python herramientas/localizar-imagenes.py --rehacer $REHACER

      - name: Descargar las imágenes y reescribir el HTML
        if: inputs.buscar == ''
        run: python herramientas/localizar-imagenes.py

      - name: Comprobar el resultado
        if: inputs.buscar == ''
        run: |
          echo "--- peso total de img/ ---"
          du -sh img || true
          python - <<'FIN'
          import io, os, re

          EXTERNAS = re.compile(r'https://(?:commons\.wikimedia|upload\.wikimedia|images\.unsplash)[^"]*')
          LOCALES = re.compile(r'"(img/[A-Za-z0-9._-]+)"')

          descargadas = len(os.listdir("img")) if os.path.isdir("img") else 0
          externas, locales, rotas = 0, 0, set()
          for archivo in ("index.html", "practica47.html"):
              texto = io.open(archivo, encoding="utf-8").read()
              externas += len(EXTERNAS.findall(texto))
              for ruta in LOCALES.findall(texto):
                  locales += 1
                  if not os.path.exists(ruta):
                      rotas.add(ruta)

          print("imágenes en img/        :", descargadas)
          print("referencias locales     :", locales)
          print("URLs externas restantes :", externas)
          print("rutas locales rotas     :", len(rotas))

          # Falla solo ante un destrozo real. Que queden unas pocas URLs
          # externas no lo es: esas imágenes siguen cargando desde la web y lo
          # ya descargado debe subirse igualmente, porque el servidor de GitHub
          # es efímero y de lo contrario se perdería en cada intento.
          problemas = []
          if descargadas == 0:
              problemas.append("no se descargó ninguna imagen")
          if locales == 0:
              problemas.append("el HTML no apunta a ninguna imagen local")
          if rotas:
              problemas.append("hay %d rutas locales rotas: %s" % (len(rotas), sorted(rotas)[:5]))

          if problemas:
              print("\nFALLA LA COMPROBACIÓN:")
              for p in problemas:
                  print("  -", p)
              raise SystemExit(1)

          if externas:
              print("\nAVISO: quedan %d URLs externas por localizar." % externas)
              print("Se sube lo conseguido; vuelve a lanzar el flujo para reintentar solo esas.")
          else:
              print("\nTodo correcto: no queda ninguna imagen externa.")
          FIN

      - name: Subir las imágenes y los HTML actualizados
        if: inputs.buscar == ''
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # El inventario va aquí a propósito: el script anota en él cada
          # descarga nueva, y si no se subiera, esa anotación se perdería al
          # destruirse el servidor y nadie sabría de dónde salió la imagen.
          git add img index.html practica47.html herramientas/inventario-imagenes.txt
          if git diff --cached --quiet; then
            echo "No hay cambios que subir."
            exit 0
          fi
          git commit -m "Descarga las imágenes al proyecto y apunta el HTML a ./img

          Ejecutado por el flujo de trabajo descargar-imagenes.yml. Las 138 imágenes
          de Wikimedia Commons y Unsplash quedan dentro del repositorio, como exige
          el reglamento de la competencia, y el sitio pasa a funcionar sin conexión."
          git push

      - name: Guardar el registro de fallos, si los hubo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: img-fallidas
          path: img-fallidas.txt
          if-no-files-found: ignore
